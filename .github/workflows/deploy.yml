name: Deploy to GitHub Pages

# 触发: 推到 main / master + 手动 dispatch
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 给 GITHUB_TOKEN 写 pages / 推 gh-pages 分支 的权限
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一次 (新推的取消旧的)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
      EXPORT_NAME: Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Web export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.zip
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.zip -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project assets
        run: |
          # --import 触发 reimport, 失败也继续 (有时第一次会因为编辑器初始化报错)
          godot --headless --import || true

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "${EXPORT_NAME}" build/web/index.html
          # 注入 PeerJS bridge (联机用) — 复制 peerjs_bridge.js + index.html 加 script tag
          bash scripts/web/inject_bridge.sh
          # GitHub Pages 默认会跑 Jekyll, 加 .nojekyll 关掉它 (不然 Godot 的 _ 开头文件会被忽略)
          touch build/web/.nojekyll

      # 检查 Pages 是 "legacy/gh-pages 分支" 模式. workflow 自带的 GITHUB_TOKEN
      # 改不了这个设置 (权限不够), 但只要一次性切对 (用户 PAT 手动 PUT 过),
      # 之后就一直是 legacy 模式. 这里只读检查, 不切, 不挂.
      - name: Verify Pages source = gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | tee /tmp/pages.json
          build_type=$(python3 -c "import json; print(json.load(open('/tmp/pages.json'))['build_type'])")
          echo "build_type=$build_type"
          if [ "$build_type" != "legacy" ]; then
            echo "::warning::Pages build_type=$build_type (期望 legacy). 部署到 gh-pages 分支可能不被读取."
            echo "::warning::用 PAT 手动 PUT 一次: curl -X PUT .../repos/.../pages -d '{\"build_type\":\"legacy\",\"source\":{\"branch\":\"gh-pages\",\"path\":\"/\"}}'"
          fi

      - name: Deploy to gh-pages branch (peaceiris, 绕开挂掉的 actions/*-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
